<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>塔羅流年｜雙人合盤</title><link rel="stylesheet" href="./styles.css"></head><body><header><div class="tag">PROFESSIONAL TAROT • WEB PROTOTYPE V0.8</div><h1>塔羅流年・國農曆合盤</h1><p>依據原始 Excel 的計算邏輯建立。國曆與農曆始終同時顯示。</p><nav class="nav"><a href="./">個人合盤</a><a href="./pair.html" class="on">雙人合盤</a></nav></header><main><section id="pair"><h2>雙人合盤 <span class="pill">左：第一人・右：第二人</span></h2><div class="pairctl2"><div><label for="nameA">第一人稱呼（選填）</label><input id="nameA" placeholder="例如：本人"></div><div><label for="birthA">第一人國曆生日</label><input type="date" id="birthA" value="1978-06-03" min="1900-01-01" max="2100-12-31"></div><div><label for="nameB">第二人稱呼（選填）</label><input id="nameB" placeholder="例如：另一半"></div><div><label for="birthB">第二人國曆生日</label><input type="date" id="birthB" min="1900-01-01" max="2100-12-31"></div></div><div style="margin-top:14px"><button id="paircalc">產生雙人合盤</button></div><p class="notice">金框表示兩人在同一欄位抽到同一張牌；滑鼠移到牌上可看牌意。</p><div id="pairError" class="warn hide"></div><div id="pairResult"></div></section><section><div class="warn"><strong>測試版本聲明：</strong>計算邏輯已依原始 Excel 移植並逐日驗證，但仍屬測試版。此版本不會將生日傳送到外部服務。</div></section></main><script src="./core.js"></script><script>
function personChart(iso,name,t,tl){const g=parse(iso),l=toLunar(iso);if(!l)return null;const gb=base(g),lb=base(l);const tri=b=>[b.nature,b.outer,b.inner];
return {name,g,l,
 trait:{s:tri(gb),l:tri(lb)},
 helper:{s:tri(gb).map(helperNo),l:tri(lb).map(helperNo)},
 years:[t.y-1,t.y,t.y+1].map(y=>({s:annual(g,y),l:annual(l,y)})),
 today:{s:[annual(g,t.y),monthNo(g,t.y,t.m),dayNo(g,t)],l:[annual(l,tl.y),monthNo(l,t.y,t.m),dayNo(l,t)]}}}
const pcell=(n,other,cls)=>`<td class="${cls}${n===other?' same':''}" title="${esc(card(n)?.meaning||'')}"><b>${esc(n)}</b><small>${esc(cardName(n))}</small></td>`;
function pairTable(title,rows,A,B){return `<div class="pairblock"><h3>${esc(title)}</h3><div class="tablewrap"><table class="pairgrid"><colgroup><col style="width:16%"><col span="4" style="width:21%"></colgroup><thead><tr><th></th><th colspan="2" class="pa">${esc(A.name)}</th><th colspan="2" class="pb">${esc(B.name)}</th></tr><tr><th>項目</th><th class="pa">☀ 國曆</th><th class="pa">☾ 農曆</th><th class="pb">☀ 國曆</th><th class="pb">☾ 農曆</th></tr></thead><tbody>${rows.map(([label,a,b])=>`<tr><td>${label}</td>${pcell(a.s,b.s,'pa')}${pcell(a.l,b.l,'pa')}${pcell(b.s,a.s,'pb')}${pcell(b.l,a.l,'pb')}</tr>`).join('')}</tbody></table></div></div>`}
function renderPair(){const eb=$('pairError');eb.classList.add('hide');const ia=$('birthA').value,ib=$('birthB').value;if(!ia||!ib){eb.textContent='請輸入兩個人的生日。';eb.classList.remove('hide');$('pairResult').innerHTML='';return}
const ts=todayIso(),t=parse(ts),tl=toLunar(ts);const A=personChart(ia,$('nameA').value.trim()||'第一人',t,tl),B=personChart(ib,$('nameB').value.trim()||'第二人',t,tl);
if(!A||!B||!tl){eb.textContent='生日須在 1900–2100 年之間。';eb.classList.remove('hide');$('pairResult').innerHTML='';return}
const pick=(o,i)=>({s:o.s[i],l:o.l[i]});const labs=['本性','外顯','內心'];
const head=`<div class="pairhead"><div class="pa"><strong>${esc(A.name)}</strong>國曆 ${fmt(A.g)}<br>農曆 ${fmtL(A.l)}</div><div class="pb"><strong>${esc(B.name)}</strong>國曆 ${fmt(B.g)}<br>農曆 ${fmtL(B.l)}</div></div>`;
$('pairResult').innerHTML=head
 +pairTable('個性',labs.map((x,i)=>[x,pick(A.trait,i),pick(B.trait,i)]),A,B)
 +pairTable('貴人',labs.map((x,i)=>[x,pick(A.helper,i),pick(B.helper,i)]),A,B)
 +pairTable('流年運勢',['去年','今年','明年'].map((x,i)=>[`${x}<span class="yr">${t.y-1+i}</span>`,A.years[i],B.years[i]]),A,B)
 +pairTable(`今天的運勢（${t.y}/${t.m}/${t.d}）`,[['年運',pick(A.today,0),pick(B.today,0)],['流月',pick(A.today,1),pick(B.today,1)],['流日',pick(A.today,2),pick(B.today,2)]],A,B)}
$('paircalc').addEventListener('click',renderPair);
loadData().catch(e=>{$('pairError').textContent='資料載入失敗：'+e.message;$('pairError').classList.remove('hide')});
</script></body></html>
